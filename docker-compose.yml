# 팀 전체 통합 docker-compose — 아직 frontend/backend 등 다른 팀원 서비스가 준비 전이라
# 지금은 자리만 잡아둔 상태. 지금 당장 쓸 수 있는 compose 파일은 각자 담당 폴더 안에 따로 있음:
#
#   database/docker-compose.yml         Postgres(pgvector) + Neo4j  → 서버(EC2)에서 실행
#   collector/airflow/docker-compose.yml  뉴스 주기수집용 Airflow    → 로컬 PC에서 실행
#
# 각 팀원이 본인 서비스(frontend/backend 등)를 완성하면 이 루트 파일에 추가해서
# `docker compose up`으로 전체를 한 번에 띄우는 통합 compose로 만들 예정.
# 담당자 논의 없이 이 파일을 구조적으로 바꾸지 말 것.

services: {}
